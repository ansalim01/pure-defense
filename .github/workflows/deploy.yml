name: CI/CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NUXT_PUBLIC_SITE_URL: ${{ secrets.NUXT_PUBLIC_SITE_URL }}

      - name: Install rsync
        run: sudo apt-get install -y rsync

      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${SSH_PORT:-22}" -H "${SSH_HOST}" >> ~/.ssh/known_hosts

      - name: Write .env
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NUXT_PUBLIC_SITE_URL: ${{ secrets.NUXT_PUBLIC_SITE_URL }}
          CLOUDFLARE_WORKER_URL: ${{ secrets.CLOUDFLARE_WORKER_URL }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
        run: |
          {
            printf 'TELEGRAM_BOT_TOKEN=%q\n' "${TELEGRAM_BOT_TOKEN}"
            printf 'TELEGRAM_CHAT_ID=%q\n' "${TELEGRAM_CHAT_ID}"
            printf 'NUXT_PUBLIC_SITE_URL=%q\n' "${NUXT_PUBLIC_SITE_URL}"
            printf 'CLOUDFLARE_WORKER_URL=%q\n' "${CLOUDFLARE_WORKER_URL}"
            printf 'WORKER_SECRET=%q\n' "${WORKER_SECRET}"
          } > /tmp/app.env

      - name: Upload build
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          PORT="${SSH_PORT:-22}"

          ssh -i ~/.ssh/id_deploy -p "${PORT}" "${SSH_USER}@${SSH_HOST}" \
            "apt-get install -y rsync -qq; mkdir -p /var/www/pure-defense/.output"

          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy -p ${PORT}" \
            .output/ \
            "${SSH_USER}@${SSH_HOST}:/var/www/pure-defense/.output/"

          scp -i ~/.ssh/id_deploy -P "${PORT}" \
            /tmp/app.env \
            "${SSH_USER}@${SSH_HOST}:/var/www/pure-defense/.output/.env"

      - name: Restart app
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "${SSH_PORT:-22}" "${SSH_USER}@${SSH_HOST}" \
            "cd /var/www/pure-defense && \
            set -a && . .output/.env && set +a && \
            (pm2 restart pure-defense --update-env 2>/dev/null || pm2 start .output/server/index.mjs --name pure-defense --update-env) && \
            pm2 save"

      - name: Notify success
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          COMMIT_MSG=$(git log -1 --format="%h %s")
          TEXT=$(printf "✅ Деплой успешен\n\nКоммит: %s\nВетка: main" "${COMMIT_MSG}")
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}"

      - name: Notify failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=❌ Деплой упал. Ветка: main. Лог: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
