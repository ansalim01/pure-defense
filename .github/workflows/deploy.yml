name: CI/CD

on:
  push:
    branches: [main]

env:
  APP_DIR: /var/www/pure-defense
  NODE_VERSION: '22'

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # ── 1. Код ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Node.js с кешем npm ────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # ── 3. Зависимости ────────────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Сборка ─────────────────────────────────────────────────────────
      - name: Build
        run: npm run build
        env:
          NUXT_PUBLIC_SITE_URL: ${{ secrets.NUXT_PUBLIC_SITE_URL }}

      # ── 5. rsync ──────────────────────────────────────────────────────────
      - name: Install rsync
        run: sudo apt-get install -y rsync

      # ── 6. SSH-ключ ───────────────────────────────────────────────────────
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p ${{ secrets.SSH_PORT || 22 }} -H "${{ secrets.SSH_HOST }}" \
            >> ~/.ssh/known_hosts

      # ── 6. .env на сервере из GitHub Secrets ──────────────────────────────
      - name: Write .env
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NUXT_PUBLIC_SITE_URL: ${{ secrets.NUXT_PUBLIC_SITE_URL }}
        run: |
          {
            echo "TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}"
            echo "TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}"
            echo "NUXT_PUBLIC_SITE_URL=${NUXT_PUBLIC_SITE_URL}"
          } > /tmp/app.env

      # ── 7. Деплой: rsync сборки + .env ────────────────────────────────────
      - name: Upload build
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" \
            "apt-get install -y rsync -qq && mkdir -p /var/www/pure-defense/.output"

          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy -p ${SSH_PORT}" \
            .output/ \
            "${SSH_USER}@${SSH_HOST}:/var/www/pure-defense/.output/"

          scp -i ~/.ssh/id_deploy -P "${SSH_PORT}" \
            /tmp/app.env \
            "${SSH_USER}@${SSH_HOST}:/var/www/pure-defense/.output/.env"

      # ── 8. Перезапуск pm2 ─────────────────────────────────────────────────
      - name: Restart app
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" \
            "pm2 restart pure-defense 2>/dev/null \
              || pm2 start /var/www/pure-defense/.output/server/index.mjs \
                   --name pure-defense \
                   --cwd /var/www/pure-defense/.output \
                   --update-env \
             && pm2 save"

      # ── 9. Telegram: успех ────────────────────────────────────────────────
      - name: Notify success
        if: success()
        run: |
          COMMIT_MSG=$(git log -1 --format="%h %s")
          TEXT=$(printf "✅ *Деплой успешен — Чистая Защита*\n\nКоммит: \`${COMMIT_MSG}\`\nВетка: \`${{ github.ref_name }}\`")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "parse_mode=Markdown" \
            --data-urlencode "text=${TEXT}"

      # ── 10. Telegram: ошибка ──────────────────────────────────────────────
      - name: Notify failure
        if: failure()
        run: |
          TEXT=$(printf "❌ *Деплой упал — Чистая Защита*\n\nВетка: \`${{ github.ref_name }}\`\n[Открыть лог](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "parse_mode=Markdown" \
            --data-urlencode "text=${TEXT}"
